# ---------------------------------------------------------------------
# 4. Adding to the shopping list by voice
# ---------------------------------------------------------------------
# No script needed. The add-on mirrors the app's shopping list to
# todo.shopping_list, so Home Assistant's built-in handling already works:
#
#     "Add milk to my shopping list"
#
# It lands in the native list and appears in the app within a few seconds.
# The same is true in reverse - anything added in the app shows up in Home
# Assistant, on dashboards, and to Assist.
#
# If you would rather the app keep its own list privately, turn off
# sync_shopping_list in Settings > Apps > MyHiroList > Configuration.

