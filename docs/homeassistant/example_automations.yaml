# Automations built on the sensors MyHiroList publishes.
#
# Before using any of these, find your own notify service: Developer tools >
# Actions, search "notify". Replace notify.mobile_app_your_phone below with
# what you find. If you both want them, add a second action.
#
# To use one: Settings > Automations & scenes > Create automation > three-dot
# menu > Edit in YAML, then paste a single block in (not the whole file).

# ---------------------------------------------------------------------
# 1. Dog food is running low
# ---------------------------------------------------------------------
# Fires once when it crosses the threshold, not repeatedly, because the
# trigger only fires on the transition.

alias: Dog food running low
description: Warns while there is still time to order more.
mode: single

triggers:
  - trigger: numeric_state
    entity_id: sensor.myhirolist_dog_food_days_left
    below: 7

actions:
  - action: notify.mobile_app_your_phone
    data:
      title: Dog food running low
      message: >
        {{ states('sensor.myhirolist_dog_food_days_left') }} days left.
      data:
        tag: myhirolist-dog-food

