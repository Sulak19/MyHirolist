# Checks for a new MyHiroList version every hour and installs it.
#
# The add-on page has an "Auto update" switch, which is worth turning on as
# well -- but Home Assistant checks for updates on its own slow schedule, so
# this automation is what makes a push show up within the hour rather than
# whenever HA next gets round to it.
#
# To use: Settings > Automations & scenes > Create automation > three-dot menu
# > Edit in YAML, then paste this in.
#
# Check the entity id first under Developer tools > States, searching for
# "myhirolist" -- it is usually update.myhirolist_update.

alias: MyHiroList - check for updates hourly
description: Pulls new versions shortly after they are published.
mode: single

triggers:
  - trigger: time_pattern
    hours: "/1"

actions:
  # Force a fresh check rather than trusting the cached state.
  - action: homeassistant.update_entity
    target:
      entity_id: update.myhirolist_update

  - delay: "00:00:30"

  - if:
      - condition: state
        entity_id: update.myhirolist_update
        state: "on"
    then:
      - action: update.install
        target:
          entity_id: update.myhirolist_update
