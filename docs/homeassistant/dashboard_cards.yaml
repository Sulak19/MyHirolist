# Dashboard cards for the MyHiroList sensors.
#
# The app itself is in the sidebar, so these are for glancing at the numbers
# without opening it -- on a wall tablet, or alongside everything else.
#
# To use: open a dashboard, three-dot menu > Edit dashboard > Add card >
# Manual, then paste one of these in.

# --- At-a-glance row ---------------------------------------------------
type: glance
title: Home Base
entities:
  - entity: sensor.myhirolist_shopping_list
    name: Shopping
  - entity: sensor.myhirolist_cleaning_due
    name: Cleaning
  - entity: sensor.myhirolist_dog_food_days_left
    name: Dog food
  - entity: sensor.myhirolist_expiring_soon
    name: Expiring

