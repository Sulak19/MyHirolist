name: MyHiroList
version: "1.0.14"
slug: myhirolist
description: Household dashboard - meals, shopping, cleaning, dog food, kitchen inventory
url: https://github.com/Sulak19/MyHirolist
arch:
  - amd64
  - aarch64
image: ghcr.io/sulak19/myhirolist-{arch}
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:clipboard-list-outline
panel_title: MyHiroList
hassio_api: true
homeassistant_api: true
options:
  sync_shopping_list: true
  sync_calendar: true
  calendar_entity: calendar.home_base
  today_calendars: ""
  log_level: info
schema:
  sync_shopping_list: bool
  sync_calendar: bool
  calendar_entity: str
  today_calendars: str?
  log_level: list(debug|info|warn|error)
